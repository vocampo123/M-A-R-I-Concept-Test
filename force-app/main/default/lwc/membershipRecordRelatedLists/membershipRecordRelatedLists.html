<template>
    <div class="related-list-stack">
        <lightning-card class="related-card" title="Engagement History" icon-name="standard:opportunity">
            <lightning-button label="View All" variant="base" slot="actions"></lightning-button>
            <div class="related-card-body">
                <lightning-datatable
                    class="related-table"
                    key-field="id"
                    data={engagementHistory}
                    columns={engagementColumns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </lightning-card>

        <lightning-card class="related-card" title="Billing History" icon-name="standard:billing">
            <lightning-button label="View All" variant="base" slot="actions"></lightning-button>
            <div class="related-card-body">
                <lightning-datatable
                    class="related-table"
                    key-field="id"
                    data={billingHistory}
                    columns={billingColumns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </lightning-card>

        <lightning-card class="related-card" title="Benefits" icon-name="standard:reward">
            <lightning-button label="View All" variant="base" slot="actions"></lightning-button>
            <div class="related-card-body">
                <lightning-datatable
                    class="related-table"
                    key-field="id"
                    data={benefits}
                    columns={benefitColumns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </lightning-card>
    </div>
</template>
